version: '3.8'
services:
  postgres:
    image: postgres:15.3
    container_name: kab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5555
      POSTGRES_DB: kubsuAppDB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kubsu-app-net
    restart: unless-stopped

  pgadmin:
    container_name: kab-pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - kubsu-app-net
    restart: unless-stopped

  keycloak:
    image: kubsu-app-keycloak/keycloak
    container_name: kab-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakDB
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: 5555

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
    ports:
      - "9098:8080"
    volumes:
      - ./themes/kubsuAppTheme/:/opt/keycloak/themes/kubsuAppTheme/
    depends_on:
      - postgres
    networks:
      - kubsu-app-net
    command: start-dev

  mail-dev:
    container_name: kab-mail-dev
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025

  config-service:
    container_name: config-service
    build: config-service
    ports:
      - 8001:8001

  registry:
    container_name: registry
    restart: always
    build: registry
    ports:
      - 8761:8761
    depends_on:
      - config-service

  gateway:
    container_name: gateway
    restart: always
    build: gateway
    ports:
      - 22022:22022
    depends_on:
      - config-service
      - registry

  account-service:
    restart: on-failure
    container_name: user-service
    build: user-service
    ports:
      - 8080:8080
    depends_on:
      - config-service
      - registry


  bill-service:
    restart: on-failure
    container_name: accounting-service
    build: accounting-service
    ports:
      - 8081:8081
    depends_on:
      - config-service
      - registry

  deposit-service:
    restart: on-failure
    container_name: report-service
    build: report-service
    ports:
      - 8082:8082
    depends_on:
      - config-service
      - registry

  notification-service:
    restart: on-failure
    container_name: notification-service
    build: notification-service
    depends_on:
      - config-service
      - registry

  rabbitmq: # login guest:guest
    image: rabbitmq:3-management
    hostname: rabbitmq
    labels:
      NAME: "rabbitmq"
    ports:
      - 5672:5672
      - 15672:15672
    depends_on:
      - config-service
      - registry
      - notification-service

networks:
  kubsu-app-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      device: /c/Program\ Files/PostgreSQL/15/data
      o: bind
  pgadmin: